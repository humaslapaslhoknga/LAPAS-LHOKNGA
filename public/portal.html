<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Website resmi Lembaga Pemasyarakatan Kelas III Lhoknga: berita, pelayanan publik, pendaftaran kunjungan online (SILAKU), dan pengaduan (SILADU).">
<title>Lapas Kelas III Lhoknga - Website Resmi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</noscript>
<style>
:root{--n950:#000c18;--n900:#01162a;--n800:#02203f;--n700:#032a52;--n600:#043666;--n500:#0a5085;--n400:#3f77a8;--n300:#7fa9cf;--n200:#aecbe3;--n100:#dbe7f3;--n50:#eef4fa;
--g300:#edcf8f;--g400:#e9c170;--g500:#dca847;--g600:#c68f31;--p100:#f2f1ef;--p200:#e5e4e2;--p300:#d3d1cd;--p400:#b8b6b1;
--ink:#01162a;--mut:#56667a;--line:#e2e8f0;--bg:#f6f8fb;--card:#fff;--ok:#047857;--bad:#be123c;--warn:#b45309;--r:18px;--sh:0 12px 30px -16px rgba(2,32,63,.28)}
html{font-size:100%;scroll-behavior:smooth}
html.fs1{font-size:112.5%}html.fs2{font-size:125%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Manrope',Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--n500);text-decoration-thickness:1px;text-underline-offset:3px}
h1,h2,h3,h4{line-height:1.2;margin:0;letter-spacing:-.01em;color:var(--n900)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--g500);outline-offset:2px;border-radius:6px}
::selection{background:var(--g400);color:var(--n900)}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--g400);color:var(--n900);padding:10px 16px;border-radius:10px;font-weight:800;z-index:300;text-decoration:none}
.skip:focus{top:8px}
.hide{display:none!important}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 20px}
.muted{color:var(--mut)}.small{font-size:.8125rem}.xs{font-size:.72rem}.b{font-weight:800}.center{text-align:center}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1 1 auto}
.stack>*+*{margin-top:14px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}

/* ===== tombol ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:14px;padding:11px 20px;font-weight:800;font-size:.9rem;cursor:pointer;text-decoration:none;transition:all .22s cubic-bezier(.4,0,.2,1);line-height:1.2;background:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-gold{background:linear-gradient(135deg,#f0d08e 0%,#E9C170 55%,#dca847 100%);color:var(--n800);box-shadow:0 10px 24px -10px rgba(233,193,112,.8)}
.btn-gold:hover{filter:brightness(1.04);box-shadow:0 14px 30px -10px rgba(233,193,112,.9)}
.btn-navy{background:var(--n700);color:#fff}.btn-navy:hover{background:var(--n600)}
.btn-line{border-color:var(--n200);color:var(--n700);background:#fff}.btn-line:hover{background:var(--n50)}
.btn-glass{border-color:rgba(255,255,255,.35);color:#fff;background:rgba(255,255,255,.08)}.btn-glass:hover{background:rgba(255,255,255,.18)}
.btn-bad{background:#fff1f2;color:var(--bad);border-color:#fecdd3}.btn-bad:hover{background:#ffe4e6}
.btn-ok{background:#ecfdf5;color:var(--ok);border-color:#a7f3d0}.btn-ok:hover{background:#d1fae5}
.btn-sm{padding:7px 13px;font-size:.78rem;border-radius:11px}
.btn-lg{padding:14px 26px;font-size:1rem}
.btn-block{width:100%}

/* ===== kartu & badge ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:0 2px 10px -4px rgba(2,32,63,.08)}
.glass{background:rgba(255,255,255,.93);backdrop-filter:blur(18px);border:1px solid rgba(233,193,112,.22)}
.lift{transition:transform .25s,box-shadow .25s}.lift:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.bdg{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:.7rem;font-weight:800;border:1px solid;white-space:nowrap}
.bdg-ok{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}.bdg-bad{background:#fff1f2;color:#9f1239;border-color:#fecdd3}
.bdg-warn{background:#fffbeb;color:#92400e;border-color:#fde68a}.bdg-info{background:var(--n50);color:var(--n700);border-color:var(--n100)}
.bdg-mute{background:#f1f5f9;color:#475569;border-color:#e2e8f0}.bdg-pur{background:#f5f3ff;color:#5b21b6;border-color:#ddd6fe}
.notice{border-radius:14px;padding:14px 16px;font-size:.88rem;border:1px solid;display:flex;gap:12px;align-items:flex-start}
.notice i{margin-top:3px}
.n-info{background:var(--n50);border-color:var(--n100);color:var(--n800)}.n-warn{background:#fffbeb;border-color:#fde68a;color:#78350f}
.n-bad{background:#fff1f2;border-color:#fecdd3;color:#881337}.n-ok{background:#ecfdf5;border-color:#a7f3d0;color:#064e3b}
.n-internal{background:repeating-linear-gradient(135deg,#fffbeb,#fffbeb 10px,#fef3c7 10px,#fef3c7 20px);border-color:#fcd34d;color:#78350f;border-style:dashed}

/* ===== header publik ===== */
.topbar{background:var(--n950);color:var(--p300);font-size:.74rem}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:38px;flex-wrap:wrap}
.topbar button,.topbar a{color:var(--p200);background:none;border:0;cursor:pointer;font-weight:700;font-size:.74rem;text-decoration:none;padding:4px 8px;border-radius:8px}
.topbar button:hover,.topbar a:hover{background:rgba(255,255,255,.1)}
.annc{background:linear-gradient(90deg,var(--g500),var(--g400));color:var(--n900);font-weight:700;font-size:.85rem;text-align:center;padding:9px 16px}
.hdr{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 6px 20px -16px rgba(2,32,63,.5)}
.hdr .wrap{max-width:1440px}
.hdr-in{display:flex;align-items:center;gap:14px;min-height:76px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--n900);min-width:0;flex:0 1 420px}
.brand>div{min-width:0}
.brand img{height:50px;width:auto;max-width:90px;object-fit:contain}
.brand b{display:block;font-size:1.08rem;font-weight:800;line-height:1.2;margin-top:3px;color:var(--n900)}
.brand span{display:block;font-size:.68rem;color:var(--mut);font-weight:600;line-height:1.25;white-space:normal;overflow:visible;overflow-wrap:anywhere}
.nav{margin-left:auto}
.nav>ul{display:flex;gap:2px;list-style:none;margin:0;padding:0}
.nav li{position:relative}
.nav>ul>li>a,.nav>ul>li>button{display:flex;align-items:center;gap:6px;padding:10px 9px;border-radius:12px;font-weight:700;font-size:.8rem;color:var(--n800);text-decoration:none;border:0;background:none;cursor:pointer;white-space:nowrap}
.nav>ul>li>a:hover,.nav>ul>li>button:hover,.nav>ul>li>a.on,.nav>ul>li>button.on{background:var(--n50);color:var(--n600)}
.nav>ul>li>a.on,.nav>ul>li>button.on{box-shadow:inset 0 -3px 0 var(--g500)}
.nav .sub{position:absolute;top:100%;left:0;min-width:250px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:8px;list-style:none;margin:6px 0 0;display:none;z-index:70}
.nav li.open>.sub,.nav li:hover>.sub,.nav li:focus-within>.sub{display:block}
.nav .sub a{display:block;padding:9px 12px;border-radius:10px;color:var(--n800);font-weight:600;font-size:.84rem;text-decoration:none}
.nav .sub a:hover{background:var(--n50);color:var(--n600)}
.hdr-act{display:flex;gap:8px;align-items:center}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--n700);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--n50)}
.menu-btn{display:none}
.searchbar{border-top:1px solid var(--line);background:#fff;padding:12px 0}
.searchbar form{display:flex;gap:10px}
@media(max-width:1399px){
 .menu-btn{display:inline-flex}.hdr-act{margin-left:auto}.hdr-act .btn-gold span.lbl{display:inline}
 .nav{position:fixed;inset:0 0 0 auto;width:min(88vw,360px);background:#fff;transform:translateX(105%);transition:transform .3s;z-index:90;overflow-y:auto;padding:80px 14px 24px;box-shadow:-20px 0 40px -20px rgba(0,0,0,.4);margin:0}
 body.nav-open .nav{transform:none}
 body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,12,24,.55);z-index:80}
 .nav>ul{flex-direction:column;gap:4px}
 .nav>ul>li>a,.nav>ul>li>button{width:100%;justify-content:space-between;font-size:.95rem;padding:13px 14px}
 .nav .sub{position:static;display:none;box-shadow:none;border:0;border-left:3px solid var(--g400);border-radius:0;margin:2px 0 8px 14px;padding:2px 0 2px 6px;min-width:0}
 .nav li:hover>.sub,.nav li:focus-within>.sub{display:none}.nav li.open>.sub{display:block}
 .nav-close{display:inline-flex!important;position:absolute;top:18px;right:16px;z-index:95}
}
.nav-close{display:none}
@media(max-width:420px){.brand span{display:none}.brand b{font-size:.85rem}.hdr-act .btn-gold{padding:10px 12px}}

/* ===== hero ===== */
.hero{position:relative;color:#fff;background:radial-gradient(ellipse at 20% 0%,var(--n700),var(--n900) 55%,var(--n950));overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background-size:cover;background-position:center;opacity:.28;z-index:-1;background-image:var(--hero-img,none)}
.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(233,193,112,.28),transparent 68%);z-index:-1}
.hero .wrap{display:grid;grid-template-columns:1.25fr .85fr;gap:36px;align-items:center;padding-top:64px;padding-bottom:72px}
.hero h1{color:#fff;font-size:clamp(1.9rem,4.4vw,3.15rem);font-weight:800;max-width:15em}
.hero p.lead{color:var(--p300);font-size:1.05rem;max-width:36em;margin-top:16px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero .kicker{display:inline-flex;gap:8px;align-items:center;background:rgba(233,193,112,.14);border:1px solid rgba(233,193,112,.4);color:var(--g300);font-weight:700;font-size:.78rem;padding:6px 14px;border-radius:99px;margin-bottom:18px}
.quick{padding:24px;border-radius:24px;color:var(--ink)}
.quick h2{font-size:1.1rem}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr;padding-top:44px;padding-bottom:48px}}

/* ===== seksi ===== */
.sec{padding:64px 0}.sec.alt{background:#fff;border-block:1px solid var(--line)}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(1.4rem,2.6vw,1.95rem);font-weight:800}
.sec-h p{color:var(--mut);margin-top:6px;max-width:42em}
.sec-h::after{content:none}
.pagehead{background:linear-gradient(135deg,var(--n900),var(--n700));color:#fff;padding:44px 0 40px;border-bottom:4px solid var(--g500)}
.pagehead h1{color:#fff;font-size:clamp(1.55rem,3.2vw,2.3rem);font-weight:800}
.pagehead p{color:var(--p300);margin-top:10px;max-width:44em}
.crumb{display:flex;gap:8px;flex-wrap:wrap;font-size:.76rem;color:var(--n200);margin-bottom:12px;list-style:none;padding:0}
.crumb a{color:var(--g300);text-decoration:none}.crumb li+li::before{content:"/";margin-right:8px;color:var(--n400)}

/* kartu layanan, berita, program */
.svc{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit;padding:20px}
.svc .ic{flex:0 0 52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--n700),var(--n500));color:var(--g300);display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.svc h3{font-size:.98rem;font-weight:800}.svc p{font-size:.82rem;color:var(--mut);margin-top:4px}
.svc.hl .ic{background:linear-gradient(135deg,#f0d08e,#dca847);color:var(--n800)}
.news{display:flex;flex-direction:column;text-decoration:none;color:inherit;overflow:hidden;padding:0}
.news .ph{aspect-ratio:16/10;background:linear-gradient(135deg,var(--n100),var(--n50));overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--n300);font-size:2.4rem}
.news .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.news:hover .ph img{transform:scale(1.05)}
.news .bd{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.news h3{font-size:1.02rem;font-weight:800;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.news p{font-size:.84rem;color:var(--mut);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.news .more{margin-top:auto;font-weight:800;font-size:.82rem;color:var(--n500)}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.74rem;color:var(--mut);font-weight:600}
.prog{padding:0;overflow:hidden;display:flex;flex-direction:column}
.prog .top{padding:20px 20px 0;display:flex;gap:14px;align-items:center}
.prog .ic{width:48px;height:48px;border-radius:14px;background:var(--n50);color:var(--n600);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex:0 0 48px}
.prog img{aspect-ratio:16/9;object-fit:cover;width:100%;margin-top:14px}
.prog .bd{padding:14px 20px 20px;font-size:.86rem;color:var(--mut)}
.stats{background:var(--n900);color:#fff;border-radius:26px;padding:34px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;text-align:center}
.stats b{display:block;font-size:2.4rem;font-weight:800;color:var(--g400);line-height:1}.stats span{font-size:.82rem;color:var(--p300)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.gal button{padding:0;border:0;border-radius:16px;overflow:hidden;aspect-ratio:4/3;cursor:zoom-in;background:var(--n50);position:relative}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.gal button:hover img{transform:scale(1.06)}
.gal figcaption{position:absolute;inset:auto 0 0;padding:26px 12px 10px;background:linear-gradient(transparent,rgba(0,12,24,.82));color:#fff;font-size:.76rem;font-weight:700;text-align:left}
.sambut{display:grid;grid-template-columns:260px 1fr;gap:34px;align-items:center}
.sambut .foto{aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:var(--n100);box-shadow:var(--sh);border:5px solid #fff}
.sambut .foto img{width:100%;height:100%;object-fit:cover}
.sambut blockquote{margin:14px 0 0;font-size:1.05rem;line-height:1.8;color:var(--n800);border-left:4px solid var(--g500);padding-left:18px;white-space:pre-line}
@media(max-width:760px){.sambut{grid-template-columns:1fr}.sambut .foto{max-width:220px}}
.info-list{list-style:none;padding:0;margin:0}.info-list li{display:flex;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.info-list li:last-child{border:0}.info-list i{color:var(--g600);width:20px;margin-top:4px;text-align:center}
.map{border:0;width:100%;height:100%;min-height:300px;border-radius:18px}
.soc{display:flex;gap:8px;flex-wrap:wrap}.soc a{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--n50);color:var(--n700);text-decoration:none}.soc a:hover{background:var(--n700);color:#fff}

/* layout halaman dengan sisi */
.layout{display:grid;grid-template-columns:270px 1fr;gap:32px;align-items:start}
.sidemenu{position:sticky;top:96px;padding:10px}
@media(max-width:900px){.layout aside .card[style*=sticky]{position:static!important}}
.sidemenu a{display:block;padding:11px 14px;border-radius:12px;color:var(--n800);font-weight:700;font-size:.86rem;text-decoration:none}
.sidemenu a:hover{background:var(--n50)}.sidemenu a.on{background:linear-gradient(135deg,#f0d08e,#dca847);color:var(--n800)}
.layout.side-r{grid-template-columns:minmax(0,1fr) 340px}
@media(max-width:900px){.layout,.layout.side-r{grid-template-columns:1fr}.sidemenu{position:static;display:flex;overflow-x:auto;gap:4px}.sidemenu a{white-space:nowrap}}

/* ===== prosa ===== */
.prose{font-size:1.02rem;line-height:1.85;color:#1e293b;max-width:76ch}
.prose h2{font-size:1.5rem;margin:1.8em 0 .5em}.prose h3{font-size:1.2rem;margin:1.5em 0 .4em}.prose h4{margin:1.3em 0 .3em}
.prose p{margin:0 0 1.05em}.prose ul,.prose ol{padding-left:1.4em;margin:0 0 1.1em}.prose li{margin:.3em 0}
.prose img{border-radius:14px;margin:1.2em auto;height:auto}
.prose blockquote{margin:1.3em 0;padding:6px 20px;border-left:4px solid var(--g500);background:var(--n50);border-radius:0 12px 12px 0;color:var(--n800)}
.prose table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:.92rem}.prose th,.prose td{border:1px solid var(--line);padding:8px 12px;text-align:left}.prose th{background:var(--n50)}
.prose figure{margin:1.2em 0}.prose figcaption{font-size:.8rem;color:var(--mut);text-align:center}
.art-hero{border-radius:22px;overflow:hidden;margin-bottom:26px;aspect-ratio:16/8;background:var(--n100)}.art-hero img{width:100%;height:100%;object-fit:cover}
.share{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.share a,.share button{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:.8rem;color:var(--n800);text-decoration:none;cursor:pointer}
.share a:hover,.share button:hover{background:var(--n50)}
.step-list{list-style:none;padding:0;margin:0;counter-reset:s}
.step-list li{counter-increment:s;display:flex;gap:14px;padding:12px 0}
.step-list li::before{content:counter(s);flex:0 0 32px;height:32px;border-radius:50%;background:var(--n700);color:var(--g300);font-weight:800;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.dot-list{padding-left:1.2em;margin:0}.dot-list li{margin:.35em 0}
details.faq{border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:10px;overflow:hidden}
details.faq summary{padding:14px 18px;font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::after{content:"+";color:var(--g600);font-size:1.3rem;line-height:1}
details.faq[open] summary::after{content:"\2212"}details.faq .ans{padding:0 18px 16px;color:var(--mut)}
.pager{display:flex;gap:6px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.pager a,.pager span{min-width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;font-weight:800;font-size:.85rem;text-decoration:none;color:var(--n800);padding:0 12px}
.pager a:hover{background:var(--n50)}.pager .cur{background:var(--n700);color:#fff;border-color:var(--n700)}

/* ===== org chart ===== */
.org,.org ul{list-style:none;margin:0;padding:0}
.org{display:flex;justify-content:center;overflow-x:auto;padding:10px 0 20px}
.org ul{display:flex;justify-content:center;padding-top:26px;position:relative}
.org li{position:relative;padding:26px 8px 0;text-align:center;display:flex;flex-direction:column;align-items:center}
.org>li{padding-top:0}
.org li::before,.org li::after{content:"";position:absolute;top:0;right:50%;border-top:2px solid var(--n200);width:50%;height:26px}
.org li::after{right:auto;left:50%;border-left:2px solid var(--n200)}

// ============================ AKSESIBILITAS: PENGUMUMAN, BACA-SUARA (TTS) ============================
function announce(msg,assertive){
  const el=$(assertive?'#sr-alert':'#sr-live'); if(!el) return;
  el.textContent=''; setTimeout(function(){ el.textContent=msg; },60);
}
const TTS={ items:[], i:0, on:false, paused:false, rate:1, voice:null, token:0, cur:null, u:null, warned:false };
function ttsSupported(){ return 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window; }
function ttsPickVoice(){
  const v=(speechSynthesis.getVoices&&speechSynthesis.getVoices())||[];
  TTS.voice=v.filter(function(x){return /^id([-_]|$)/i.test(x.lang)})[0]||null;
  if(!TTS.voice&&v.length&&!TTS.warned){ TTS.warned=true; toast('Suara bahasa Indonesia belum terpasang di perangkat ini, sehingga pengucapan bisa kurang tepat. Pasang di Pengaturan > Bahasa > Text-to-speech.'); }
}
if(ttsSupported()&&speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged',function(){ if(TTS.on) ttsPickVoice(); });
function ttsText(el){ return String(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim(); }
function ttsCollect(root){
  const sel='h1,h2,h3,h4,p,li,tr,figcaption,blockquote,dt,dd,legend,label,.notice>div';
  const out=[];
  $$(sel,root).forEach(function(el){
    if(el.closest('[aria-hidden="true"],.hide,[hidden],#tts-bar,.toast')) return;
    if(!el.getClientRects().length) return;
    if(el!==root && el.querySelector(sel)&&el.tagName!=='TR') return;
    let t;
    if(el.tagName==='TR'){
      const cs=$$('th,td',el).map(ttsText).filter(Boolean);
      t=(el.firstElementChild&&el.firstElementChild.tagName==='TH'&&cs.length>1)?cs[0]+': '+cs.slice(1).join(', '):cs.join(', ');
    } else t=ttsText(el);
    if(!t) return;
    if(!/[.!?:;]$/.test(t)) t+='.';
    const parts=[], re=/[^.!?;:]+[.!?;:]*\s*/g; let m, buf='';
    while((m=re.exec(t))){ if((buf+m[0]).length>200&&buf){ parts.push(buf); buf=m[0]; } else buf+=m[0]; }
    if(buf.trim()) parts.push(buf);
    out.push({el:el,parts:parts.length?parts:[t]});
  });
  return out;
}
function ttsMark(el){
  if(TTS.cur) TTS.cur.classList.remove('tts-now');
  TTS.cur=el||null;
  if(el){ el.classList.add('tts-now'); try{ el.scrollIntoView({block:'center',behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'}); }catch(e){} }
}
function ttsSpeak(){
  if(!TTS.on||TTS.paused) return;
  if(TTS.i>=TTS.items.length){ announce('Selesai membacakan.'); return ttsStop(true); }
  const it=TTS.items[TTS.i], tok=TTS.token; let k=0;
  ttsMark(it.el);
  (function next(){
    if(!TTS.on||TTS.paused||tok!==TTS.token) return;
    if(k>=it.parts.length){ TTS.i++; return ttsSpeak(); }
    const u=new SpeechSynthesisUtterance(it.parts[k++]); TTS.u=u;
    u.lang=TTS.voice?TTS.voice.lang:'id-ID'; if(TTS.voice) u.voice=TTS.voice; u.rate=TTS.rate;
    u.onend=next;
    u.onerror=function(e){ if(e&&(e.error==='interrupted'||e.error==='canceled')) return; next(); };
    speechSynthesis.speak(u);
  })();
}
function ttsStart(root){
  if(!ttsSupported()){ toast('Peramban ini belum mendukung baca-suara. Gunakan pembaca layar bawaan perangkat Anda.','bad'); return; }
  const r=typeof root==='string'?$(root):root; if(!r) return;
  ttsStop(true);
  const items=ttsCollect(r);
  if(!items.length){ toast('Tidak ada teks yang dapat dibacakan di halaman ini.'); return; }
  ttsPickVoice();
  try{ TTS.rate=parseFloat(localStorage.getItem('ttsr'))||1; }catch(e){ TTS.rate=1; }
  const sel=$('#tts-rate'); sel.value=String(TTS.rate); if(!sel.value) sel.value='1';
  TTS.items=items; TTS.i=0; TTS.on=true; TTS.paused=false; TTS.token++;
  $('#tts-pp').textContent='Jeda'; $('#tts-bar').classList.add('on'); document.body.classList.add('tts-on');
  const b=$('#tts-btn'); if(b) b.setAttribute('aria-pressed','true');
  ttsSpeak();
}
function ttsPage(){ if(TTS.on) ttsStop(); else ttsStart('#main'); }
function ttsToggle(){
  if(!TTS.on) return;
  if(TTS.paused){ TTS.paused=false; TTS.token++; $('#tts-pp').textContent='Jeda'; ttsSpeak(); }
  else { TTS.paused=true; TTS.token++; try{ speechSynthesis.cancel(); }catch(e){} $('#tts-pp').textContent='Lanjutkan'; }
}
function ttsSkip(d){
  if(!TTS.on) return;
  TTS.token++; try{ speechSynthesis.cancel(); }catch(e){}
  TTS.i=Math.max(0,Math.min(TTS.items.length-1,TTS.i+d)); TTS.paused=false; $('#tts-pp').textContent='Jeda'; ttsSpeak();
}
function ttsRate(v){
  TTS.rate=parseFloat(v)||1; try{ localStorage.setItem('ttsr',TTS.rate); }catch(e){}
  if(TTS.on&&!TTS.paused){ TTS.token++; try{ speechSynthesis.cancel(); }catch(e){} ttsSpeak(); }
}
function ttsStop(silent){
  const was=TTS.on; TTS.on=false; TTS.paused=false; TTS.token++;
  try{ if(ttsSupported()) speechSynthesis.cancel(); }catch(e){}
  ttsMark(null);
  const bar=$('#tts-bar'), had=bar&&bar.contains(document.activeElement);
  if(bar) bar.classList.remove('on'); document.body.classList.remove('tts-on');
  const b=$('#tts-btn'); if(b) b.setAttribute('aria-pressed','false');
  if(was&&!silent){ announce('Pembacaan dihentikan.'); }
  if(had&&b) try{ b.focus(); }catch(e){}
}
window.addEventListener('pagehide',function(){ try{ if(ttsSupported()) speechSynthesis.cancel(); }catch(e){} });

document.addEventListener('keydown',function(e){

  const sb=$('#searchbar'); if(sb&&!sb.classList.contains('hide')){ toggleSearch(); const sbtn=$('#srch-btn'); if(sbtn) sbtn.focus(); return; }
  if(TTS.on) ttsStop();
});

// Perbaikan otomatis pada elemen yang dibuat dinamis (ikon dekoratif, kolom wajib, tautan tab baru, gambar tanpa alt)
(function(){
  let pend=false;
  function fix(){
    pend=false;
    $$('i.fa-solid:not([aria-hidden]),i.fa-regular:not([aria-hidden]),i.fa-brands:not([aria-hidden])').forEach(function(i){ i.setAttribute('aria-hidden','true'); });
    $$('.req:not([data-a11y])').forEach(function(s){
      s.setAttribute('data-a11y','1'); s.setAttribute('aria-hidden','true');
      const l=s.closest('label'), id=l&&l.getAttribute('for'), t=id&&document.getElementById(id); if(t) t.setAttribute('aria-required','true');
    });
    $$('.prose a[target=_blank]:not([data-nt])').forEach(function(a){
      a.setAttribute('data-nt','1'); if(a.closest('.ed')) return;
      const s=document.createElement('span'); s.className='sr-only'; s.textContent=' (membuka tab baru)'; a.appendChild(s);
    });
    $$('.prose img:not([alt])').forEach(function(im){ if(!im.closest('.ed')) im.setAttribute('alt','Foto pada artikel'); });
  }
  new MutationObserver(function(){ if(!pend){ pend=true; requestAnimationFrame(fix); } }).observe(document.body,{childList:true,subtree:true});
  fix();
})();

function wSave(){
  const g=function(id){const e=$('#'+id); return e?e.value:null;};
  if(W.step===2){ ['nama','nik','hp','email','alamat'].forEach(function(k){ const v=g('w-'+k); if(v!==null) W[k]=v.trim(); }); const a=g('w-wbp'); if(a!==null) W.namaWbp=a.trim(); const h=g('w-hub'); if(h!==null) W.hubungan=h; }
  if(W.step===3){ W.pengikut=W.pengikut.map(function(p,i){ return {nama:(g('pk-n'+i)||'').trim(),hubungan:g('pk-h'+i)||'',usia:(g('pk-u'+i)||'').trim()}; }); W.kebutuhan=$$('[name=w-keb]:checked').map(function(c){return c.value}); const d=g('w-det'); if(d!==null) W.detailKebutuhan=d.trim(); }
  if(W.step===4){ const c=$('#w-setuju'); if(c) W.setuju=c.checked; W.website=g('w-web')||''; }
}
function wCheck(){
  if(W.step===1&&(!W.tgl||!W.sesi)) return 'Pilih tanggal dan sesi kunjungan terlebih dahulu.';
  if(W.step===2){
    if(W.nama.length<3) return 'Nama lengkap wajib diisi.';
    if(!/^\d{16}$/.test(W.nik)) return 'NIK harus 16 digit angka.';
    if(!/^(\+62|62|0)\d{8,13}$/.test(W.hp.replace(/[\s\-]/g,''))) return 'Nomor HP / WhatsApp tidak valid.';
    if(W.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(W.email)) return 'Format email tidak valid.';
    if(W.alamat.length<5) return 'Alamat wajib diisi.';
    if(W.namaWbp.length<3) return 'Nama warga binaan wajib diisi.';
    if(!W.hubungan) return 'Pilih hubungan dengan warga binaan.';
    if(JD.aturan.ktpWajib&&!W.berkas) return 'Foto identitas wajib diunggah.';
  }
  if(W.step===3){ for(let i=0;i<W.pengikut.length;i++) if(W.pengikut[i].nama.length<3) return 'Nama pengikut '+(i+1)+' minimal 3 huruf (atau hapus baris tersebut).'; }
  if(W.step===4&&!W.setuju) return 'Centang pernyataan persetujuan terlebih dahulu.';
  return '';
}
function wShowErr(m){ const e=$('#w-err'); if(e){ e.textContent=''; setTimeout(function(){ e.textContent=m; },60); if(m) e.scrollIntoView({block:'center',behavior:'smooth'}); } }
function wStepFocus(){ wFocus('#w-body h2'); announce('Langkah '+W.step+' dari '+WSTEPS.length+': '+WSTEPS[W.step-1]+'.'); }
function wNext(){ wSave(); const m=wCheck(); if(m) return wShowErr(m); W.step++; wRender(); window.scrollTo(0,0); wStepFocus(); }
function wBack(){ wSave(); W.step--; wRender(); window.scrollTo(0,0); wStepFocus(); }
function wAddPk(){ wSave(); W.pengikut.push({nama:'',hubungan:'',usia:''}); wRender(); wFocus('#pk-n'+(W.pengikut.length-1)); announce('Baris pengikut '+W.pengikut.length+' ditambahkan.'); }
function wDelPk(i){ wSave(); W.pengikut.splice(i,1); wRender(); wFocus('#w-body h2'); announce('Pengikut dihapus.'); }
async function wFile(inp){
  const f=inp.files[0]; if(!f){ W.berkas=null; W.berkasNama=''; return; }
  try{ if(f.size>12*1048576) throw new Error('Ukuran berkas terlalu besar (maks. 12 MB).'); W.berkas=await filePayload(f,4); W.berkasNama=f.name; $('#w-ktp-h').textContent='Terpilih: '+f.name; }
  catch(e){ W.berkas=null; W.berkasNama=''; inp.value=''; toast(e.message,'bad'); }
}
async function wSubmit(){
  wSave(); const m=wCheck(); if(m) return wShowErr(m);
  try{
    const f={tgl:W.tgl,sesi:W.sesi,nama:W.nama,nik:W.nik,hp:W.hp,email:W.email,alamat:W.alamat,namaWbp:W.namaWbp,hubungan:W.hubungan,pengikut:W.pengikut.filter(function(p){return p.nama}),kebutuhan:W.kebutuhan,detailKebutuhan:W.detailKebutuhan,setuju:W.setuju,website:W.website};
    W.hasil=await busy(api('publik_daftarKunjungan',f,W.berkas)); wRender(); window.scrollTo(0,0);
  }catch(e){ wShowErr(e.message); toast(e.message,'bad'); try{ JD=await api('publik_jadwal'); }catch(x){} }
}

async function cekStatus(e){
  if(e) e.preventDefault(); const no=$('#cs-no').value.trim(), kd=$('#cs-kd').value.trim(), out=$('#cs-out'); out.innerHTML='<div class="sk" style="height:140px"></div>';
  try{
    const d=await api('publik_cekKunjungan',no,kd), coll=['Disetujui','Selesai'].indexOf(d.status)>=0;
    out.innerHTML='<div class="card"><div class="row between"><div><span class="xs muted">Nomor registrasi</span><h2 style="font-family:ui-monospace,monospace;font-size:1.3rem">'+esc(d.noReg)+'</h2></div>'+statusBadge(d.status)+'</div><hr style="border:0;border-top:1px dashed var(--line);margin:16px 0"><dl class="kv"><dt>Pengunjung</dt><dd>'+esc(d.nama)+'</dd><dt>Warga binaan</dt><dd>'+esc(d.namaWbp)+'</dd><dt>Jadwal</dt><dd>'+esc(fmtDate(d.tgl))+' · '+esc(d.sesi)+(d.jam?' ('+esc(d.jam)+' WIB)':'')+'</dd><dt>Pengikut</dt><dd>'+d.pengikut+' orang</dd>'+(d.kebutuhan.length?'<dt>Kebutuhan khusus</dt><dd>'+esc(d.kebutuhan.join(', '))+'</dd>':'')+'<dt>Didaftarkan</dt><dd>'+esc(fmtDT(d.tglDaftar))+'</dd>'+(d.catatan?'<dt>Catatan petugas</dt><dd>'+esc(d.catatan)+'</dd>':'')+'</dl>'+
     (d.status==='Disetujui'?'<div class="notice n-ok" style="margin-top:16px"><i class="fa-solid fa-circle-check"></i><div>Pendaftaran disetujui. Hadir tepat waktu dan bawa identitas asli.</div></div>':d.status==='Menunggu Verifikasi'?'<div class="notice n-info" style="margin-top:16px"><i class="fa-solid fa-hourglass-half"></i><div>Pendaftaran sedang diverifikasi petugas. Silakan periksa kembali nanti.</div></div>':d.status==='Ditolak'?'<div class="notice n-bad" style="margin-top:16px"><i class="fa-solid fa-circle-xmark"></i><div>Pendaftaran ditolak. Anda dapat mendaftar ulang atau menghubungi petugas layanan.</div></div>':'')+
     (d.dapatBatal?'<div style="margin-top:16px"><button class="btn btn-bad btn-sm" onclick="batalDaftar(\''+esc(d.noReg)+'\',\''+esc(kd.toUpperCase())+'\')"><i class="fa-solid fa-ban"></i> Batalkan pendaftaran</button></div>':'')+'</div>';

async function batalDaftar(no,kd){
  if(!await confirmBox('Batalkan pendaftaran kunjungan '+no+'? Kuota akan dilepas dan tindakan ini tidak dapat dibatalkan.',{danger:1,ok:'Ya, batalkan',title:'Batalkan pendaftaran'})) return;
  try{ await busy(api('publik_batalKunjungan',no,kd)); toast('Pendaftaran dibatalkan.','ok'); cekStatus(); }catch(e){ toast(e.message,'bad'); }
}

async function render(){
  const r=parseRoute(); S.routed=true; closeNav(); AFTER=null; ttsStop(true);
  const t0=document.title, p=r.parts[0]||'';
  if(p==='login') return showLogin();
  if(p==='admin') return showAdmin(r);
  document.body.dataset.mode='public';
  const app=$('#app'), my=(render.n=(render.n||0)+1);
  app.innerHTML=skel(); app.setAttribute('aria-busy','true');
  let html;
  try{
    switch(p){
      case '': html=await pgHome(); break;
      case 'profil': html=await pgProfil(r); break;
      case 'berita': html=r.parts[1]?await pgBeritaDetail(r):await pgBerita(r); break;
      case 'pelayanan': html=r.parts[1]?await pgLayanan(r):await pgPelayanan(r); break;
      case 'kunjungan': html=r.parts[1]==='daftar'?await pgDaftar():r.parts[1]==='status'?await pgStatus(r):r.parts[1]==='jadwal'?await pgJadwal():await pgKunjungan(); break;
      case 'pembinaan': html=await pgPembinaan(); break;
      case 'informasi-publik': html=r.parts[1]==='permohonan'?await pgPermohonan(r):await pgInfoPublik(r); break;
      case 'galeri': html=await pgGaleri(r); break;
      case 'kontak': html=await pgKontak(r); break;
      case 'cari': html=await pgCari(r); break;
      case 'halaman': html=await pgHalaman(r); break;
      default: html=pg404();
    }
  }catch(e){ html=e.code==='404'?pg404():pgError(e); }
  if(my!==render.n) return;
  app.innerHTML=html; app.removeAttribute('aria-busy'); markNav(); window.scrollTo(0,0);
  if(p==='kunjungan'&&r.parts[1]==='daftar') wRender();
  const h1=$('h1',app); let ft=$('#main');
  if(h1){ h1.setAttribute('tabindex','-1'); h1.style.outline='0'; ft=h1; if(document.title===t0) document.title=h1.textContent.trim()+' - '+(S.cfg.Nama_Singkat||'Lapas Kelas III Lhoknga'); }
  try{ ft.focus({preventScroll:true}); }catch(e){}
  if(AFTER){ const f=AFTER; AFTER=null; f(); }
}

function sideHtml(cur){
  const logo=safeUrl(S.cfg.Logo_URL), out=[]; let pend='';
  AMENU.forEach(function(m){

let ACUR='';
async function showAdmin(r){
  if(!S.user||!S.token){ location.hash='#/login'; return; }
  document.body.dataset.mode='admin'; $('#login-root').innerHTML='';
  const id=r.parts[1]||'dashboard', mod=AMENU.filter(function(m){return m.id===id})[0];
  if(!mod||!canSee(mod)){ location.hash='#/admin'; return; }
  if(!$('#acontent')){
    $('#adm-root').innerHTML='<div class="adm"><div class="side-ov" onclick="document.body.classList.remove(\'side-open\')"></div><aside class="side" id="aside"></aside><div class="amain"><header class="ahead"><button class="icon-btn" onclick="document.body.classList.toggle(\'side-open\');this.setAttribute(\'aria-expanded\',document.body.classList.contains(\'side-open\'))" aria-label="Menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button><h1 id="atitle"></h1><span class="grow"></span><span class="row who small b" style="gap:8px"><span class="bdg bdg-info">'+esc(S.user.role)+'</span>'+esc(S.user.nama)+'</span><button class="btn btn-bad btn-sm" onclick="logout()"><i class="fa-solid fa-power-off"></i> Keluar</button></header><main class="acontent" id="acontent" tabindex="-1"><div class="inner" id="ainner"></div></main></div></div>';
  }
  document.body.classList.remove('side-open');
  $('#aside').innerHTML=sideHtml(id); $('#atitle').textContent=mod.t; const chg=(ACUR!==id); ACUR=id; document.title=mod.t+' - Dashboard'; if(chg) announce('Halaman '+mod.t+'.');
  const box=$('#ainner'); box.innerHTML='<div class="sk" style="height:200px"></div>';
  if(S.user.wajibGanti){ showGanti(true); return; }
  try{
    const f=ADMIN_PAGES[id], html=await f(r);
    if(ACUR!==id) return;
    box.innerHTML=html; $('#acontent').scrollTop=0;
    if(AFTER){ const a=AFTER; AFTER=null; a(); }
  }catch(e){ if(e.code!=='SESI'&&e.code!=='GANTI') box.innerHTML='<div class="notice n-bad" role="alert"><i class="fa-solid fa-circle-exclamation"></i><div>'+esc(e.message)+'</div></div>'; }
  refreshBadges();
}
async function refreshBadges(){
  try{
    const d=await adm('admin_dashboard'), set=function(k,n){ const e=$('#cnt-'+k); if(e){ e.textContent=n; e.classList.toggle('hide',!n); } };
    if(d.kunjungan) set('kj',d.kunjungan.menunggu); if(d.pengaduan) set('pg',d.pengaduan.baru+d.pengaduan.permohonanBaru);

function tbl(cols,rows,empty){
  if(!rows.length) return emptyBox(empty||'Belum ada data.');
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+cols.map(function(c){return '<th scope="col">'+esc(c[0])+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+cols.map(function(c){ const isA=c[0]==='Aksi'; return '<td '+(isA?'class="acts-td"':'data-l="'+esc(c[0])+'"')+'>'+(isA?'<div class="acts">'+c[1](r)+'</div>':c[1](r))+'</td>'; }).join('')+'</tr>'}).join('')+'</tbody></table></div>';
}

function upField(id,url,kind,accept,dk){
  const isImg=kind!=='dokumen';
  return '<div class="row" style="align-items:flex-start;flex-wrap:nowrap"><div class="uprev" id="pv-'+id+'">'+(isImg&&safeUrl(url)?'<img src="'+esc(url)+'" alt="" referrerpolicy="no-referrer">':'<i class="fa-solid '+(isImg?'fa-image':'fa-file')+'"></i>')+'</div><div class="grow"><input class="in" id="'+id+'"'+(dk?' data-k="'+dk+'"':'')+' value="'+esc(url||'')+'" placeholder="https://… (tempel tautan atau unggah)" oninput="upPv(\''+id+'\','+isImg+')"><div style="margin-top:8px"><label class="btn btn-line btn-sm"><i class="fa-solid fa-upload"></i> Unggah berkas<input type="file" hidden accept="'+esc(accept||'image/*')+'" onchange="upDo(this,\''+id+'\',\''+kind+'\')"></label></div></div></div>';
}
function upPv(id,isImg){ const u=$('#'+id).value.trim(), p=$('#pv-'+id); if(p&&isImg) p.innerHTML=safeUrl(u)?'<img src="'+esc(u)+'" alt="" referrerpolicy="no-referrer">':'<i class="fa-solid fa-image"></i>'; }
async function upDo(inp,id,kind){
  const f=inp.files[0]; if(!f) return;
  try{ const pl=await busy(filePayload(f,10)); const r=await busy(adm('admin_upload',kind,pl)); $('#'+id).value=r.url; upPv(id,kind!=='dokumen'); toast('Berkas berhasil diunggah.'+(r.warn?' '+r.warn:''),r.warn?'':'ok'); }
  catch(e){ toast(e.message,'bad'); } inp.value='';
}
function setField(it){
  const k=it.k, id='st-'+k, lab=SET_LABEL[k]||k.replace(/_/g,' '), hint=it.ket?'<span class="hint">'+esc(it.ket)+'</span>':'';
  if(SET_YN.indexOf(k)>=0) return '<div class="fld"><label class="switch"><input type="checkbox" id="'+id+'" data-k="'+k+'" data-t="yn"'+(it.v==='Ya'?' checked':'')+'> '+esc(lab)+'</label>'+hint+'</div>';
  if(SET_IMG.indexOf(k)>=0) return '<div class="fld" style="grid-column:1/-1"><label for="'+id+'">'+esc(lab)+'</label>'+upField(id,it.v,'profil','image/*',k)+hint+'</div>';
  if(SET_LONG.indexOf(k)>=0) return '<div class="fld" style="grid-column:1/-1"><label for="'+id+'">'+esc(lab)+'</label><textarea class="in" id="'+id+'" data-k="'+k+'" rows="5">'+esc(it.v)+'</textarea>'+hint+'</div>';
  return '<div class="fld"><label for="'+id+'">'+esc(lab)+'</label><input class="in" id="'+id+'" data-k="'+k+'" value="'+esc(it.v)+'"'+(SET_NUM.indexOf(k)>=0?' type="number" min="0"':'')+'>'+hint+'</div>';
}
function setCollect(root){ const o={}; $$('[data-k]',root).forEach(function(e){ o[e.dataset.k]=e.dataset.t==='yn'?(e.checked?'Ya':'Tidak'):e.value; }); return o; }
async function setSave(btn,root,extra){
  const o=setCollect($(root)); if(extra) Object.assign(o,extra());
  try{ await busy(adm('admin_simpanPengaturan',o)); toast('Pengaturan disimpan.','ok'); const d=await api('publik_init'); S.cfg=d.cfg; $('#pub-top').innerHTML=headerHtml(); $('#foot').innerHTML=footerHtml(); bindNav(); }catch(e){ toast(e.message,'bad'); }
}
ADMIN_PAGES.pengaturan=async function(){
  const list=await adm('admin_getPengaturan'), by={}; list.forEach(function(i){by[i.k]=i;});
  const sec=SET_GRUP.map(function(g){ const f=g[1].filter(function(k){return by[k]}); return f.length?'<section class="card" style="margin-bottom:18px"><h2 style="font-size:1.05rem;margin-bottom:14px">'+esc(g[0])+'</h2><div class="fgrid">'+f.map(function(k){return setField(by[k])}).join('')+'</div></section>':''; }).join('');
  return '<div id="st-root">'+sec+'<button class="btn btn-gold btn-lg" onclick="setSave(this,\'#st-root\')"><i class="fa-solid fa-floppy-disk"></i> Simpan pengaturan</button></div>';
};
const HARI_URUT=[[1,'Senin'],[2,'Selasa'],[3,'Rabu'],[4,'Kamis'],[5,'Jumat'],[6,'Sabtu'],[0,'Minggu']];
ADMIN_PAGES['kunjungan-pengaturan']=async function(){
  const list=await adm('admin_getPengaturan'), by={}; list.forEach(function(i){by[i.k]=i;});
  const jd=jsonParse(by.Jadwal_Kunjungan&&by.Jadwal_Kunjungan.v,{});
  const hari=HARI_URUT.map(function(h){ const t=(jd[h[0]]||[]).map(function(s){return s.nama+'|'+(s.jam||'')+'|'+s.kuota}).join('\n'); return '<div class="day-row"><label for="jd-'+h[0]+'" class="b">'+h[1]+'</label><textarea class="in" id="jd-'+h[0]+'" rows="2" placeholder="Kosongkan bila tidak ada kunjungan. Contoh: Sesi 1|08.30 - 10.00|30">'+esc(t)+'</textarea></div>'; }).join('');
  return '<div id="kp-root"><section class="card" style="margin-bottom:18px"><h2 style="font-size:1.05rem;margin-bottom:6px">Jadwal sesi kunjungan</h2><p class="small muted" style="margin-bottom:12px">Satu sesi per baris dengan format <b>Nama sesi|Jam|Kuota</b>. Kuota dihitung per pendaftaran. Isi sesuai ketentuan resmi Lapas; sistem tidak mengisi jadwal sendiri.</p>'+hari+'</section>'+
   '<section class="card" style="margin-bottom:18px"><h2 style="font-size:1.05rem;margin-bottom:14px">Aturan pendaftaran</h2><div class="fgrid">'+SET_KJ.filter(function(k){return by[k]}).map(function(k){return setField(by[k])}).join('')+'</div></section><button class="btn btn-gold btn-lg" onclick="setSave(this,\'#kp-root\',kpJadwal)"><i class="fa-solid fa-floppy-disk"></i> Simpan jadwal dan aturan</button></div>';
};
function jsonParse(s,d){ try{ const v=JSON.parse(s); return v==null?d:v; }catch(e){ return d; } }
function kpJadwal(){
  const o={}; HARI_URUT.forEach(function(h){ o[h[0]]=lines($('#jd-'+h[0]).value).map(function(l){ const p=l.split('|'); return {nama:(p[0]||'').trim(),jam:(p[1]||'').trim(),kuota:(p[2]||'').trim()}; }); });
  return {Jadwal_Kunjungan:JSON.stringify(o)};
}

let ED_SEL=null;
function edBox(id,html){
  const B=function(c,ic,t,v){ return '<button type="button" onmousedown="event.preventDefault()" onclick="edCmd(\''+c+'\''+(v?',\''+v+'\'':'')+')" aria-label="'+t+'" title="'+t+'"><i class="fa-solid '+ic+'"></i></button>'; };
  return '<div class="editor"><div class="tb" role="toolbar" aria-label="Format teks">'+B('bold','fa-bold','Tebal')+B('italic','fa-italic','Miring')+B('underline','fa-underline','Garis bawah')+B('formatBlock','fa-heading','Judul bagian','H2')+B('formatBlock','fa-h','Subjudul','H3')+B('formatBlock','fa-paragraph','Paragraf biasa','P')+B('insertUnorderedList','fa-list-ul','Daftar poin')+B('insertOrderedList','fa-list-ol','Daftar nomor')+B('formatBlock','fa-quote-right','Kutipan','BLOCKQUOTE')+
   '<button type="button" onmousedown="event.preventDefault()" onclick="edLink()" aria-label="Sisipkan tautan" title="Tautan"><i class="fa-solid fa-link"></i></button><label class="btn btn-sm" style="min-width:36px;height:36px;padding:0;background:#fff;border:1px solid #e2e8f0;color:var(--n700)" title="Sisipkan gambar" onmousedown="saveSel()"><i class="fa-solid fa-image"></i><input type="file" hidden accept="image/*" onchange="edImg(this)"></label>'+B('removeFormat','fa-eraser','Hapus format')+B('undo','fa-rotate-left','Urungkan')+B('redo','fa-rotate-right','Ulangi')+'</div><div class="ed prose" id="'+id+'" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Isi" data-ph="Tulis isi di sini…" onpaste="edPaste(event)" onblur="saveSel()">'+cleanHtml(html||'')+'</div></div>';
}
function edCmd(c,v){ const e=document.activeElement; document.execCommand(c,false,v||null); }
function saveSel(){ const s=getSelection(); if(s.rangeCount&&$('.ed')&&$('.ed').contains(s.anchorNode)) ED_SEL=s.getRangeAt(0).cloneRange(); }
function restoreSel(){ const ed=$('.ed'); if(!ed) return; ed.focus(); if(ED_SEL){ const s=getSelection(); s.removeAllRanges(); s.addRange(ED_SEL); } }
function edPaste(e){ e.preventDefault(); const t=(e.clipboardData||window.clipboardData).getData('text/plain'); document.execCommand('insertText',false,t); }
async function edImg(inp){
  const f=inp.files[0]; if(!f) return;
  try{ const r=await busy((async function(){ const pl=await filePayload(f,10); return adm('admin_upload','berita',pl); })()); restoreSel(); document.execCommand('insertImage',false,r.url); const alt=(prompt('Tulis deskripsi singkat gambar ini untuk pembaca layar (tunanetra). Contoh: "Kepala Lapas menyerahkan bantuan kepada warga".','')||'').trim(); $$('.ed img').forEach(function(im){ if(im.getAttribute('src')===r.url&&!im.getAttribute('alt')) im.setAttribute('alt',alt); }); toast('Gambar disisipkan.','ok'); }catch(e){ toast(e.message,'bad'); } inp.value='';
}
function edLink(){
  saveSel(); const m=modal('<h3>Sisipkan tautan</h3><div class="fld"><label for="ln-u">Alamat tautan (https://…)</label><input class="in" id="ln-u" placeholder="https://"></div><div class="mfoot"><button class="btn btn-line" id="ln-x">Batal</button><button class="btn btn-navy" id="ln-ok">Sisipkan</button></div>',{cls:'sm'});
  $('#ln-x',m.el).onclick=function(){m.close()};
  $('#ln-ok',m.el).onclick=function(){ const u=$('#ln-u',m.el).value.trim(); if(!/^https?:\/\/[^\s]+$/i.test(u)) return toast('Alamat tautan tidak valid.','bad'); m.close(); restoreSel(); document.execCommand('createLink',false,u); };
}

ADMIN_PAGES.berita=async function(r){ if(r.parts[2]==='baru'||r.parts[2]==='edit') return beritaEditor(r); AFTER=function(){ brLoad(); }; return '<form class="card toolbar" onsubmit="return brLoad(event)"><div class="fld grow"><label for="br-q">Cari judul / kategori / penulis</label><input class="in" id="br-q"></div><div class="fld"><label for="br-s">Status</label><select class="in" id="br-s"><option value="">Semua</option><option>Draft</option><option>Menunggu Persetujuan</option><option>Terjadwal</option><option>Terbit</option><option>Arsip</option></select></div><button class="btn btn-navy">Terapkan</button><a class="btn btn-gold" href="#/admin/berita/baru"><i class="fa-solid fa-plus"></i> Tulis berita</a></form><div id="br-out"></div>'; };
async function brLoad(e){
  if(e) e.preventDefault(); const out=$('#br-out'); out.innerHTML='<div class="sk" style="height:160px"></div>';
  try{
    const d=await adm('admin_beritaList',{q:$('#br-q').value,status:$('#br-s').value}), sup=S.user.role===R_SUPER;
    out.innerHTML=tbl([['Judul',function(r){return '<b>'+esc(trunc(r.judul,80))+'</b><br><span class="xs muted">'+esc(r.kategori)+' · '+esc(r.penulis)+'</span>'+(r.catatan&&r.status==='Draft'?'<br><span class="xs" style="color:var(--bad)">Revisi: '+esc(r.catatan)+'</span>':'')}],['Status',function(r){return statusBadge(r.status)+(r.status==='Terjadwal'?'<br><span class="xs muted">tayang '+esc(fmtDT(r.tglJadwal))+(r.tayang?' (sudah tayang)':'')+'</span>':'')}],['Diubah',function(r){return esc(fmtDT(r.diubah))}],['Dibaca',function(r){return r.dilihat}],
      ['Aksi',function(r){ let a='<a class="btn btn-line btn-sm" href="#/admin/berita/edit/'+esc(r.id)+'"><i class="fa-solid fa-pen"></i> Edit</a>';
        if(r.tayang) a+='<a class="btn btn-line btn-sm" href="#/berita/'+esc(r.slug)+'" target="_blank"><i class="fa-solid fa-eye"></i> Lihat</a>';
        if(sup&&r.status==='Menunggu Persetujuan') a+='<button class="btn btn-ok btn-sm" onclick="brSt(\''+esc(r.id)+'\',\'Terbit\')"><i class="fa-solid fa-check"></i> Setujui</button><button class="btn btn-bad btn-sm" onclick="brSt(\''+esc(r.id)+'\',\'Draft\',1)">Kembalikan</button>';
        if(r.status==='Terbit'||r.status==='Terjadwal') a+='<button class="btn btn-line btn-sm" onclick="brSt(\''+esc(r.id)+'\',\'Draft\')">Tarik ke draft</button>';

        if(sup) a+='<button class="btn btn-bad btn-sm" onclick="brDel(\''+esc(r.id)+'\')" aria-label="Hapus permanen"><i class="fa-solid fa-trash"></i></button>'; return a; }]],d.items,'Belum ada berita.');
  }catch(x){ out.innerHTML='<div class="notice n-bad"><div>'+esc(x.message)+'</div></div>'; }
  return false;

async function brSt(id,st,note){
  let cat=''; if(note){ cat=await confirmBox('Tulis catatan revisi untuk penulis.',{title:'Kembalikan ke draft',input:'Catatan revisi',ok:'Kembalikan'}); if(!cat) return; }
  else if(!await confirmBox('Ubah status berita menjadi "'+st+'"?',{title:'Konfirmasi',ok:'Ya'})) return;
  try{ await busy(adm('admin_beritaStatus',id,st,cat===true?'':cat)); toast('Status berita: '+st+'.','ok'); brLoad(); }catch(e){ toast(e.message,'bad'); }
}
async function brDel(id){ if(!await confirmBox('Hapus berita ini secara permanen? Tindakan tidak dapat dibatalkan. Gunakan Arsip bila ragu.',{danger:1,ok:'Hapus permanen',title:'Hapus berita'})) return; try{ await busy(adm('admin_beritaHapus',id)); toast('Berita dihapus.','ok'); brLoad(); }catch(e){ toast(e.message,'bad'); } }

let CR=null, CR_ROWS=[];
Object.keys(CRUD).forEach(function(k){ ADMIN_PAGES[k]=async function(){ return crudPage(k); }; });
async function crudPage(k){
  const c=CRUD[k]; CR=k; CR_ROWS=await adm('admin_list',c.ent);
  if(k==='pejabat'){ const m={}; CR_ROWS.forEach(function(r){m[r.ID]=r.Nama;}); CR_ROWS.forEach(function(r){r._atasan=m[r.Atasan_ID];}); }
  const cols=c.cols.map(function(x){ return x[0]==='Aksi'?['Aksi',function(r){ return c.extra(r)+crudActs(r); }]:x; });
  if(!c.cols.some(function(x){return x[0]==='Aksi'})) cols.push(['Aksi',crudActs]);
  return '<div class="row between" style="margin-bottom:16px"><span class="small muted">'+CR_ROWS.length+' data</span><button class="btn btn-gold" onclick="crudForm(\'\')"><i class="fa-solid fa-plus"></i> '+esc(c.add)+'</button></div>'+tbl(cols,CR_ROWS,'Belum ada data. Klik tombol tambah untuk memulai.');
}
function crudActs(r){ const c=CRUD[CR], id=esc(r[c.key]); return '<button class="btn btn-navy btn-sm" onclick="crudForm(\''+id+'\')"><i class="fa-solid fa-pen"></i> Edit</button>'+(c.noDel?'':'<button class="btn btn-bad btn-sm" onclick="crudDel(\''+id+'\')" aria-label="Hapus"><i class="fa-solid fa-trash"></i></button>'); }
function fField(f,v,rows){
  const id='f-'+f.k, req=f.req?' <span class="req">*</span>':'', hint=f.h?'<span class="hint">'+esc(f.h)+'</span>':'', t=f.t||'text';
  if(t==='switch') return '<div class="fld"><label class="switch"><input type="checkbox" id="'+id+'"'+(v!=='Tidak'?' checked':'')+'> '+esc(f.l)+'</label></div>';
  let inner;
  if(t==='textarea'||t==='lines') inner='<textarea class="in" id="'+id+'" rows="'+(t==='lines'?5:3)+'">'+esc(v)+'</textarea>';
  else if(t==='select'){ let o=typeof f.o==='function'?f.o():f.o; if(o==='atasan') o=rows.filter(function(r){return r.ID!==(window.__crId||'')}).map(function(r){return [r.ID,r.Nama+' — '+r.Jabatan]}); inner='<select class="in" id="'+id+'"><option value="">'+(f.k==='Atasan_ID'?'(tanpa atasan / puncak bagan)':'Pilih')+'</option>'+o.map(function(x){ const a=Array.isArray(x)?x:[x,x]; return '<option value="'+esc(a[0])+'"'+(v===a[0]?' selected':'')+'>'+esc(a[1])+'</option>'}).join('')+'</select>'; }
  else if(t==='img') inner=upField(id,v,f.kind||'galeri');
  else if(t==='file') inner=upField(id,v,'dokumen','.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,image/*');
  else if(t==='html') inner=edBox(id,v);
  else if(t==='num') inner='<input class="in" type="number" min="0" id="'+id+'" value="'+esc(v)+'">';
  else inner='<input class="in" id="'+id+'" value="'+esc(v)+'" maxlength="300">';
  return '<div class="fld" style="'+(t==='lines'||t==='html'||t==='textarea'||t==='img'||t==='file'?'grid-column:1/-1':'')+'"><label for="'+id+'">'+esc(f.l)+req+'</label>'+inner+hint+'</div>';
}
function fRead(root,fields){
  const o={}; fields.forEach(function(f){ const e=$('#f-'+f.k,root); if(!e) return; o[f.k]=f.t==='switch'?e.checked:f.t==='html'?e.innerHTML:e.value; }); return o;
}
function crudForm(id){
  const c=CRUD[CR], row=id?CR_ROWS.filter(function(r){return r[c.key]===id})[0]:null; window.__crId=id;
  const m=modal('<h3>'+(id?'Edit data':esc(c.add))+'</h3><form id="cr-f" class="fgrid" onsubmit="return false">'+c.fields.map(function(f){ return fField(f,row?(row[f.k]===undefined?'':row[f.k]):(f.k==='Aktif'?'Ya':''),CR_ROWS); }).join('')+'</form><div class="mfoot"><button class="btn btn-line" id="cr-x">Batal</button><button class="btn btn-gold" id="cr-ok"><i class="fa-solid fa-floppy-disk"></i> Simpan</button></div>',{cls:'wide',sticky:true,label:c.add});
  $('#cr-x',m.el).onclick=function(){m.close()};
  $('#cr-ok',m.el).onclick=async function(){
    const d=fRead(m.el,c.fields); if(id) d[c.key]=id;
    for(const f of c.fields){ if(f.req&&!String(d[f.k]||'').trim()) return toast(f.l+' wajib diisi.','bad'); }
    try{ await busy(adm('admin_save',c.ent,d)); toast('Data tersimpan.','ok'); m.close(); reloadAdmin(); }catch(e){ toast(e.message,'bad'); }
  };
}
async function crudDel(id){ if(!await confirmBox('Hapus data ini secara permanen?',{danger:1,ok:'Hapus',title:'Hapus data'})) return; try{ await busy(adm('admin_delete',CRUD[CR].ent,id)); toast('Data dihapus.','ok'); reloadAdmin(); }catch(e){ toast(e.message,'bad'); } }

function userForm(un){

  $('#u-x',m.el).onclick=function(){m.close()};
  $('#u-ok',m.el).onclick=async function(){ try{ await busy(adm('admin_userSimpan',{username:$('#u-un',m.el).value,nama:$('#u-nm',m.el).value,jabatan:$('#u-jb',m.el).value,role:$('#u-rl',m.el).value,email:$('#u-em',m.el).value,status:$('#u-st',m.el).value,password:un?'':$('#u-pw',m.el).value})); toast('Akun tersimpan.','ok'); m.close(); reloadAdmin(); }catch(e){ toast(e.message,'bad'); } };
}
